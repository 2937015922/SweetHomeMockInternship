name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / Java 8
            os: ubuntu-latest
            java: "8"
            distribution: temurin
          - name: Ubuntu / Java 11
            os: ubuntu-latest
            java: "11"
            distribution: temurin
          - name: Windows / Java 8
            os: windows-latest
            java: "8"
            distribution: temurin
          - name: Windows / Java 11
            os: windows-latest
            java: "11"
            distribution: temurin
          - name: macOS ARM64 / Java 8
            os: macos-latest
            java: "8"
            distribution: zulu
          - name: macOS ARM64 / Java 11
            os: macos-latest
            java: "11"
            distribution: temurin
          - name: macOS Intel / Java 8
            os: macos-15-intel
            java: "8"
            distribution: temurin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run smoke test
        run: mvn -B -ntp -Dtest=BuildSmokeTest clean verify
